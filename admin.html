<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Ch.Nga CBH</title>
  <link rel="icon" type="image/png" href="66f67bda7f23f.png">
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<nav class="nav">
  <div class="nav-brand">
    <span class="nav-logo">Г</span>
    <span class="nav-name">Ch.Nga CBH — Admin</span>
  </div>
  <div class="nav-links">
    <a href="index.html" class="nav-link">← Back to Site</a>
  </div>
  <div class="nav-auth">
    <div id="authLoggedIn" style="display:none">
      <span class="user-greeting" id="userGreeting"></span>
      <button class="btn btn-ghost" onclick="logout()">Sign Out</button>
    </div>
  </div>
</nav>

<main class="admin-page" id="adminPage" style="display:none">
  <h1>Exam Manager</h1>
  <p class="sub">Upload file JSON lên</p>

  <!-- UPLOAD ZONE -->
  <div class="upload-zone" onclick="document.getElementById('jsonFileInput').click()">
    <div class="upload-zone-icon">📂</div>
    <h3>Upload Exam JSON</h3>
    <p>Click to choose a .json exam file, or drag and drop it here</p>
    <input type="file" id="jsonFileInput" accept=".json" onchange="handleFileUpload(event)"/>
  </div>

  <!-- JSON PREVIEW -->
  <div id="previewSection" style="display:none;margin-bottom:32px">
    <h2 style="font-family:var(--font-display);margin-bottom:16px">Preview</h2>
    <div class="sidebar-card" id="previewCard"></div>
    <div style="display:flex;gap:12px;margin-top:16px">
      <button class="btn btn-primary" onclick="publishExam()">✅ Publish Exam</button>
      <button class="btn btn-ghost" onclick="cancelPreview()">Cancel</button>
    </div>
  </div>

  <!-- EXAM LIST -->
  <h2 style="font-family:var(--font-display);margin-bottom:16px">Published Exams</h2>
  <div class="exam-list-admin" id="adminExamList">
    <div style="color:var(--muted);font-size:14px">Loading…</div>
  </div>

  <!-- JSON FORMAT GUIDE -->
  <div style="margin-top:48px">
    <h2 style="font-family:var(--font-display);margin-bottom:16px">📋 JSON Format Guide</h2>
    <div class="sidebar-card">
    </div>
  </div>
</main>

<!-- Access denied -->
<div id="accessDenied" style="display:none;text-align:center;padding:120px 40px">
  <div style="font-size:64px;margin-bottom:24px">🔒</div>
  <h2 style="font-family:var(--font-display);font-size:32px;margin-bottom:12px">Access Denied</h2>
  <p style="color:var(--muted);margin-bottom:24px">You must be an admin to view this page.</p>
  <a href="index.html" class="btn btn-primary">Return Home</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
